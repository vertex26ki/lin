
name: 🐧 Ubuntu 22.04 Cloud Terminal

on:
  workflow_dispatch:

jobs:
  ubuntu-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. PREPARE HOST + INSTALL TOOLS
      # ==========================================================
      - name: 🧰 Prepare Runner
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================================="
          echo "  🐧 PREPARING GITHUB RUNNER"
          echo "=========================================================="

          sudo apt-get update -y
          sudo apt-get install -y curl wget ca-certificates

          echo
          echo "[1/2] Installing cloudflared..."

          sudo curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version

          echo
          echo "[2/2] Installing ttyd..."

          sudo curl -fsSL \
            "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" \
            -o /usr/local/bin/ttyd

          sudo chmod +x /usr/local/bin/ttyd

          ttyd --version

          echo
          echo "✅ Runner prepared successfully."

      # ==========================================================
      # 2. CREATE UBUNTU 22.04 CONTAINER
      # ==========================================================
      - name: 🐧 Create Ubuntu 22.04
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================================="
          echo "  🐧 STARTING UBUNTU 22.04 CONTAINER"
          echo "=========================================================="

          docker rm -f cynet-ubuntu 2>/dev/null || true

          docker pull ubuntu:22.04

          docker run -d \
            --name cynet-ubuntu \
            ubuntu:22.04 \
            /bin/bash -c "while true; do sleep 3600; done"

          echo
          echo "✅ Ubuntu container started."

          echo
          echo "Ubuntu version:"
          docker exec cynet-ubuntu cat /etc/os-release

      # ==========================================================
      # 3. INSTALL PACKAGES
      # ==========================================================
      - name: 📦 Install Ubuntu Packages
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================================="
          echo "  📦 INSTALLING PACKAGES INSIDE UBUNTU"
          echo "=========================================================="

          docker exec cynet-ubuntu bash -c '
            export DEBIAN_FRONTEND=noninteractive

            apt-get update -y

            apt-get install -y \
              bash \
              bash-completion \
              ca-certificates \
              curl \
              wget \
              git \
              python3 \
              python3-pip \
              sudo \
              zsh \
              tmux \
              htop \
              nano \
              vim \
              unzip \
              zip \
              net-tools \
              iproute2 \
              iputils-ping \
              dnsutils \
              procps \
              psmisc \
              file \
              less

            echo
            echo "=========================================="
            echo " Installed packages successfully"
            echo "=========================================="
          '

          echo
          echo "✅ Ubuntu packages installed."

      # ==========================================================
      # 4. START EVERYTHING IN ONE STEP
      # ==========================================================
      - name: 🌐 Start Web Terminal + Cloudflare
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================================="
          echo "  🌐 STARTING WEB TERMINAL"
          echo "=========================================================="

          # ------------------------------------------------------
          # Login credentials
          # ------------------------------------------------------
          TTYD_USER="cynet"
          TTYD_PASS="Cynet@2026"

          # ------------------------------------------------------
          # Cleanup possible old processes
          # ------------------------------------------------------
          pkill -f '/usr/local/bin/ttyd' 2>/dev/null || true
          pkill -f 'cloudflared tunnel' 2>/dev/null || true

          sleep 2

          # ======================================================
          # START TTYD
          # ======================================================

          echo
          echo "[1/2] Starting ttyd..."

          ttyd \
            -W \
            -p 7681 \
            -c "${TTYD_USER}:${TTYD_PASS}" \
            -t fontSize=16 \
            -t 'theme={"background":"#0f172a","foreground":"#38bdf8","cursor":"#38bdf8"}' \
            docker exec -i cynet-ubuntu /bin/bash \
            > /tmp/ttyd.log 2>&1 &

          TTYD_PID=$!

          echo "ttyd PID: ${TTYD_PID}"

          # ------------------------------------------------------
          # Wait until ttyd listens
          # ------------------------------------------------------

          READY=0

          for i in $(seq 1 30); do

            if ss -lnt | awk '{print $4}' | grep -Eq '(^|:)7681$'; then
              READY=1
              break
            fi

            if ! kill -0 "${TTYD_PID}" 2>/dev/null; then
              echo
              echo "❌ ttyd exited."
              echo
              cat /tmp/ttyd.log || true
              exit 1
            fi

            echo "Waiting for ttyd... ${i}/30"
            sleep 2
          done

          if [ "${READY}" -ne 1 ]; then
            echo
            echo "❌ ttyd failed to start."
            echo
            cat /tmp/ttyd.log || true
            exit 1
          fi

          echo "✅ ttyd is listening on port 7681."

          # ======================================================
          # START CLOUDFLARE
          # ======================================================

          echo
          echo "[2/2] Starting Cloudflare Quick Tunnel..."

          rm -f /tmp/cloudflared.log

          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:7681 \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "cloudflared PID: ${CLOUDFLARED_PID}"

          # ------------------------------------------------------
          # Wait for Cloudflare URL
          # ------------------------------------------------------

          URL=""

          echo
          echo "Waiting for Cloudflare URL..."

          for i in $(seq 1 40); do

            URL=$(
              grep -Eo \
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                | head -n 1 \
                || true
            )

            if [ -n "${URL}" ]; then
              break
            fi

            if ! kill -0 "${CLOUDFLARED_PID}" 2>/dev/null; then
              echo
              echo "❌ cloudflared exited."
              echo
              cat /tmp/cloudflared.log || true
              exit 1
            fi

            echo "Waiting... ${i}/40"
            sleep 2
          done

          if [ -z "${URL}" ]; then
            echo
            echo "❌ Cloudflare URL was not detected."
            echo
            cat /tmp/cloudflared.log || true
            exit 1
          fi

          # ======================================================
          # SUCCESS
          # ======================================================

          echo
          echo
          echo "=========================================================="
          echo "          🔥 UBUNTU 22.04 IS ONLINE 🔥"
          echo "=========================================================="
          echo
          echo "🌐 URL:"
          echo "${URL}"
          echo
          echo "👤 Username:"
          echo "${TTYD_USER}"
          echo
          echo "🔑 Password:"
          echo "${TTYD_PASS}"
          echo
          echo "=========================================================="
          echo "  Ubuntu 22.04"
          echo "  Web Terminal: ttyd"
          echo "  Local Port: 7681"
          echo "=========================================================="
          echo
          echo "⚠️ Temporary GitHub Actions environment"
          echo "⚠️ Maximum runtime: 6 hours"
          echo
          echo "✅ EVERYTHING IS RUNNING."
          echo

          # ======================================================
          # KEEP EVERYTHING ALIVE
          # ======================================================

          while true; do

            # Check Ubuntu container
            if ! docker ps --format '{{.Names}}' \
              | grep -qx 'cynet-ubuntu'; then

              echo
              echo "❌ Ubuntu container stopped."
              docker logs cynet-ubuntu || true
              exit 1
            fi

            # Check ttyd
            if ! kill -0 "${TTYD_PID}" 2>/dev/null; then

              echo
              echo "❌ ttyd stopped."
              echo
              cat /tmp/ttyd.log || true
              exit 1
            fi

            # Check Cloudflare
            if ! kill -0 "${CLOUDFLARED_PID}" 2>/dev/null; then

              echo
              echo "❌ Cloudflare tunnel stopped."
              echo
              cat /tmp/cloudflared.log || true
              exit 1
            fi

            sleep 30

          done

      # ==========================================================
      # 5. CLEANUP
      # ==========================================================
      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f cynet-ubuntu 2>/dev/null || true
          pkill -f '/usr/local/bin/ttyd' 2>/dev/null || true
          pkill -f 'cloudflared tunnel' 2>/dev/null || true
